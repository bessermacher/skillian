# Investigation Source Configuration
# Defines Datasphere tables and their structure for data investigation

schema: "BW2AI"

reports:
  consolidation_management:
    description: "Consolidation Management report - group financial consolidation"
    versions:
      - code: "001"
        name: "Actual"
        table: "CV_ZBC_AA61"
      - code: "002"
        name: "Actuals at last year budget rate"
        table: "CV_ZBC_AA61"
      - code: "003"
        name: "Actuals at budget rate"
        table: "CV_ZBC_AA61"
      - code: "004"
        name: "Actuals at next year budget rate"
        table: "CV_ZBC_AA61"
      - code: "021"
        name: "Forecast"
        table: "CV_ZBC_AA62"
    check_dimensions:
      - column: "/BIC/ZCOMPCODE"
        aliases: ["company_code", "cocd", "company"]
      - column: "/BIC/ZVERSION"
        aliases: ["version", "zversion"]
      - column: "FISCPER"
        aliases: ["fiscal_period", "period", "month", "0fiscper"]
      - column: "/BIC/ZSCOPE"
        aliases: ["scope", "consolidation_scope", "zscope"]
    default_group_by:
      - "/BIC/ZCOMPCODE"
      - "/BIC/ZVERSION"
      - "FISCPER"
      - "/BIC/ZSCOPE"

tables:
  bpc_consolidation:
    description: "BPC Consolidation engine data (pre-reporting)"
    table: "CV_ZBC_AA01P"
    check_dimensions:
      - column: "/BIC/ZCOMPCODE"
        aliases: ["company_code", "cocd", "company"]
      - column: "/BIC/ZVERSION"
        aliases: ["version", "zversion"]
      - column: "FISCPER"
        aliases: ["fiscal_period", "period", "month"]
      - column: "/BIC/ZSCOPE"
        aliases: ["scope", "consolidation_scope", "zscope"]
    default_group_by:
      - "/BIC/ZCOMPCODE"
      - "/BIC/ZVERSION"
      - "FISCPER"
      - "/BIC/ZSCOPE"

  ownership:
    description: "Company code ownership/scope membership table"
    table: "CV_ZBC_AA08Z"
    check_dimensions:
      - column: "/BIC/ZCOMPCODE"
        aliases: ["company_code", "cocd", "company"]
      - column: "FISCPER"
        aliases: ["fiscal_period", "period", "month"]
      - column: "/BIC/ZSCOPE"
        aliases: ["scope", "consolidation_scope", "zscope"]
      - column: "/BIC/ZVERSION"
        aliases: ["version", "zversion"]
    default_group_by:
      - "/BIC/ZCOMPCODE"
      - "FISCPER"
      - "/BIC/ZSCOPE"
      - "/BIC/ZVERSION"

scope_values:
  S_NONE: "No consolidation scope - currency conversion only"
  S_LEGAL: "Legal consolidation scope"
  S_LEGAL_DKK: "Legal consolidation scope (DKK)"
  S_LEGAL_SPECIAL: "Special legal consolidation scope"
